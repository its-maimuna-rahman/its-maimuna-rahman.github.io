<template id="ref"><section id="reference"><h2>Reference</h2><p class="lead">Special functions, generating functions and identities used throughout the distribution pages.</p>
<div class="rg">
<div class="box"><h4>Gamma function family</h4>$$\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\,dt,\qquad z>0$$$$\gamma(s,x)=\int_0^x t^{s-1}e^{-t}\,dt,\qquad \Gamma(s,x)=\int_x^\infty t^{s-1}e^{-t}\,dt$$$$\gamma(s,x)+\Gamma(s,x)=\Gamma(s)$$$$P(s,x)=\frac{\gamma(s,x)}{\Gamma(s)},\qquad Q(s,x)=1-P(s,x)$$$$\Gamma(z+1)=z\,\Gamma(z),\quad \Gamma(n)=(n-1)!,\quad \Gamma\!\left(\tfrac12\right)=\sqrt{\pi}$$</div>
<div class="box"><h4>Beta function family</h4>$$B(a,b)=\int_0^1 t^{a-1}(1-t)^{b-1}\,dt=\frac{\Gamma(a)\,\Gamma(b)}{\Gamma(a+b)}$$$$B(x;a,b)=\int_0^x t^{a-1}(1-t)^{b-1}\,dt$$$$I_x(a,b)=\frac{B(x;a,b)}{B(a,b)},\qquad 0\le x\le 1$$</div>
<div class="box"><h4>Error function and normal CDF</h4>$$\operatorname{erf}(x)=\frac{2}{\sqrt{\pi}}\int_0^x e^{-t^2}\,dt,\qquad \operatorname{erfc}(x)=1-\operatorname{erf}(x)$$$$\Phi(z)=\frac12\left[1+\operatorname{erf}\!\left(\frac{z}{\sqrt2}\right)\right]$$</div>
<div class="box"><h4>Binomial coefficient and hypergeometric functions</h4>$$\binom{n}{x}=\frac{n!}{x!\,(n-x)!}$$$$a^{(k)}=a(a+1)\cdots(a+k-1)$$$${}_1F_1(a;b;t)=\sum_{k=0}^{\infty}\frac{a^{(k)}}{b^{(k)}}\frac{t^k}{k!}$$$${}_2F_1(a,b;c;z)=\sum_{k=0}^{\infty}\frac{a^{(k)}\,b^{(k)}}{c^{(k)}}\frac{z^k}{k!}$$</div>
<div class="box"><h4>Generating functions</h4>$$M_X(t)=E\!\left[e^{tX}\right],\qquad \varphi_X(t)=E\!\left[e^{itX}\right]$$$$K_X(t)=\ln M_X(t),\qquad G_X(s)=E\!\left[s^{X}\right]$$$$E[X^n]=M_X^{(n)}(0),\qquad \kappa_n=K_X^{(n)}(0),\qquad P(X=k)=\frac{G_X^{(k)}(0)}{k!}$$</div>
<div class="box"><h4>Shape measures</h4>$$\gamma_1=\frac{\kappa_3}{\kappa_2^{3/2}}=\frac{\mu_3}{\sigma^3},\qquad \beta_1=\gamma_1^2$$$$\gamma_2=\frac{\kappa_4}{\kappa_2^{2}}=\frac{\mu_4}{\sigma^4}-3,\qquad \beta_2=\gamma_2+3$$$$\mu_k=E\!\left[(X-\mu)^k\right]$$</div>
<div class="box"><h4>Basic identities</h4>$$\operatorname{Var}(X)=E[X^2]-\mu^2,\qquad \sigma=\sqrt{\operatorname{Var}(X)}$$$$E[aX+b]=a\mu+b,\qquad \operatorname{Var}(aX+b)=a^2\sigma^2$$$$X\perp Y\ \Rightarrow\ M_{X+Y}(t)=M_X(t)\,M_Y(t)$$</div>
<div class="box"><h4>Relationships between distributions</h4>$$\sum_{i=1}^{n}\mathrm{Bern}(p)\sim\mathrm{Bin}(n,p),\qquad \mathrm{Bin}(n,p)\to\mathrm{Pois}(\lambda)\ \ (np=\lambda,\ n\to\infty)$$$$\mathrm{Geom}=\mathrm{NB}(1,p),\qquad \sum_{i=1}^{k}\mathrm{Exp}(\lambda)\sim\mathrm{Gamma}(k,1/\lambda),\qquad \chi^2_k=\mathrm{Gamma}(k/2,\,2)$$$$Z^2\sim\chi^2_1,\qquad \frac{Z}{\sqrt{V/\nu}}\sim t_\nu,\qquad \frac{U/d_1}{V/d_2}\sim F_{d_1,d_2}$$$$t_1=\mathrm{Cauchy}(0,1),\qquad \ln X\sim N(\mu,\sigma^2)\Rightarrow X\sim\mathrm{LogN}(\mu,\sigma)$$</div>
</div></section></template>

const SS={
"Student's t Distribution":T`<div class="box fb w"><h4>Construction and sample-statistic form</h4><p class="ex" style="margin-top:0">A standard normal variable divided by the square root of an independent chi-square variable scaled by its degrees of freedom:</p>$$t_{\nu}=\frac{Z}{\sqrt{\chi^{2}_{\nu}/\nu}}$$$$\chi^{2}_{\nu}=\sum_{i=1}^{\nu}Z_i^{2},\qquad Z_i\overset{\text{iid}}{\sim}N(0,1)$$<p class="ex">One-sample statistic for a normal sample \(X_1,\dots,X_n\), built from the sample mean and the sum of squares:</p>$$t=\frac{\bar{X}-\mu}{S/\sqrt{n}}\sim t_{n-1},\qquad \bar{X}=\frac{1}{n}\sum_{i=1}^{n}X_i$$$$S^{2}=\frac{SS}{n-1},\qquad SS=\sum_{i=1}^{n}\left(X_i-\bar{X}\right)^{2}$$$$Z=\frac{\bar{X}-\mu}{\sigma/\sqrt{n}},\qquad \chi^{2}_{n-1}=\frac{SS}{\sigma^{2}}=\frac{(n-1)S^{2}}{\sigma^{2}}\ \ \Longrightarrow\ \ t=\frac{Z}{\sqrt{\chi^{2}_{n-1}/(n-1)}}$$<p class="ex">Two independent normal samples with equal variance (pooled):</p>$$t=\frac{\left(\bar{X}_1-\bar{X}_2\right)-\left(\mu_1-\mu_2\right)}{S_p\sqrt{\dfrac{1}{n_1}+\dfrac{1}{n_2}}}\sim t_{n_1+n_2-2},\qquad S_p^{2}=\frac{SS_1+SS_2}{n_1+n_2-2}$$<p class="ex"><b>Notation.</b> \(Z\): standard normal variable. \(\chi^{2}_{\nu}\): independent chi-square variable with \(\nu\) degrees of freedom. \(Z_i\): independent standard normal variables, so \(\chi^{2}_{\nu}\) is the sum of \(\nu\) squared \(Z_i\). \(\nu\): degrees of freedom of \(t\) (\(n-1\) for one sample, \(n_1+n_2-2\) for the pooled test).</p><p class="ex">\(n\): sample size. \(X_i\): the \(i\)-th observation. \(\bar{X}\): sample mean. \(\mu\): population mean (the hypothesised value). \(\sigma\): population standard deviation.</p><p class="ex">\(SS\): sum of squares of the observations about the sample mean. \(S^{2}\): sample variance (\(SS\) divided by its degrees of freedom). \(S/\sqrt{n}\): estimated standard error of \(\bar{X}\).</p><p class="ex">\(n_1,n_2\): sizes of the two samples. \(\bar{X}_1,\bar{X}_2\): sample means. \(\mu_1,\mu_2\): population means. \(SS_1,SS_2\): sum of squares within each sample. \(S_p^{2}\): pooled variance.</p></div>`,
'F Distribution':T`<div class="box fb w"><h4>Construction and sample-statistic form</h4><p class="ex" style="margin-top:0">The ratio of two independent chi-square variables, each divided by its degrees of freedom:</p>$$F_{d_1,d_2}=\frac{\chi^{2}_{d_1}/d_1}{\chi^{2}_{d_2}/d_2}$$$$\chi^{2}_{d_1}=\sum_{i=1}^{d_1}Z_i^{2},\qquad \chi^{2}_{d_2}=\sum_{i=1}^{d_2}W_i^{2},\qquad Z_i,W_i\overset{\text{iid}}{\sim}N(0,1)$$<p class="ex">Ratio of sample variances from two independent normal samples:</p>$$F=\frac{S_1^{2}/\sigma_1^{2}}{S_2^{2}/\sigma_2^{2}}\sim F_{n_1-1,\,n_2-1},\qquad S_i^{2}=\frac{SS_i}{n_i-1},\qquad SS_i=\sum_{j=1}^{n_i}\left(X_{ij}-\bar{X}_i\right)^{2}$$$$\chi^{2}_{n_i-1}=\frac{SS_i}{\sigma_i^{2}}\ \ \Longrightarrow\ \ F=\frac{\chi^{2}_{n_1-1}/(n_1-1)}{\chi^{2}_{n_2-1}/(n_2-1)}$$$$F=\frac{S_1^{2}}{S_2^{2}}\quad\text{when }\sigma_1^{2}=\sigma_2^{2}$$<p class="ex">One-way ANOVA with \(k\) groups:</p>$$F=\frac{MS_B}{MS_W}=\frac{SS_B/(k-1)}{SS_W/(N-k)}\sim F_{k-1,\,N-k}$$$$SS_B=\sum_{j=1}^{k}n_j\left(\bar{X}_j-\bar{X}\right)^{2},\qquad SS_W=\sum_{j=1}^{k}\sum_{i=1}^{n_j}\left(X_{ij}-\bar{X}_j\right)^{2}$$<p class="ex"><b>Notation.</b> \(\chi^{2}_{d_1},\chi^{2}_{d_2}\): independent chi-square variables. \(Z_i,W_i\): independent standard normal variables, so each chi-square is the sum of its squared normals. \(d_1,d_2\): numerator and denominator degrees of freedom.</p><p class="ex">\(n_i\): size of sample \(i\). \(X_{ij}\): the \(j\)-th observation in sample \(i\). \(\bar{X}_i\): mean of sample \(i\). \(\sigma_i^{2}\): population variance. \(S_i^{2}\): sample variance. \(SS_i\): sum of squares about the sample mean.</p><p class="ex">\(k\): number of groups. \(n_j\): size of group \(j\). \(N=\sum_j n_j\): total sample size. \(\bar{X}_j\): group mean. \(\bar{X}\): grand mean. \(SS_B,SS_W\): between-group and within-group sums of squares. \(MS_B,MS_W\): mean squares (each \(SS\) divided by its degrees of freedom, \(k-1\) and \(N-k\)).</p></div>`,
'Chi-Square':T`<div class="box fb w"><h4>Construction and sample-statistic form</h4><p class="ex" style="margin-top:0">A sum of \(\nu\) squared independent standard normal variables:</p>$$\chi^{2}_{\nu}=\sum_{i=1}^{\nu}Z_i^{2},\qquad Z_i\overset{\text{iid}}{\sim}N(0,1)$$<p class="ex">Sample-statistic form for a normal sample \(X_1,\dots,X_n\), built from the sum of squares:</p>$$\chi^{2}_{n-1}=\frac{SS}{\sigma^{2}}=\frac{(n-1)S^{2}}{\sigma^{2}}=\sum_{i=1}^{n}\left(\frac{X_i-\bar{X}}{\sigma}\right)^{2}$$$$S^{2}=\frac{SS}{n-1},\qquad SS=\sum_{i=1}^{n}\left(X_i-\bar{X}\right)^{2},\qquad \bar{X}=\frac{1}{n}\sum_{i=1}^{n}X_i$$<p class="ex">When \(\mu\) is known, take \(Z_i=(X_i-\mu)/\sigma\):</p>$$\sum_{i=1}^{n}\left(\frac{X_i-\mu}{\sigma}\right)^{2}\sim\chi^{2}_{n}$$<p class="ex"><b>Notation.</b> \(Z_i\): independent standard normal variables, so \(\chi^{2}_{\nu}\) is the sum of \(\nu\) squared \(Z_i\). \(\nu\): degrees of freedom (the parameter \(k\) above).</p><p class="ex">\(n\): sample size. \(X_i\): the \(i\)-th observation. \(\bar{X}\): sample mean. \(\mu\): population mean. \(\sigma\): population standard deviation.</p><p class="ex">\(SS\): sum of squares of the observations about the sample mean. \(S^{2}\): sample variance (\(SS\) divided by its degrees of freedom \(n-1\)).</p></div>`};
